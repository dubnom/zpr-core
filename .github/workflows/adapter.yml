name: Rust-adapter

on:
  push:
    branches: [ "main" ]
    paths:
      - 'adapter/ph/**'
      - 'adapter/cli/**'
      - 'zpr-ext/**'
      - 'cslab/**'
      - 'cbpf-rs/**'
      - 'libnode2/**'
      - 'integration-test/**'
      - 'packaging/macos/**'
      - 'zpr/**'
      - '.github/workflows/adapter.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    paths:
      - 'adapter/ph/**'
      - 'adapter/cli/**'
      - 'zpr-ext/**'
      - 'cslab/**'
      - 'cbpf-rs/**'
      - 'libnode2/**'
      - 'integration-test/**'
      - 'packaging/macos/**'
      - 'zpr/**'
      - '.github/workflows/adapter.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  VISA_SERVICE_RELEASE: v0.18.0

jobs:
  macos-arm64-package:
    name: macOS Apple Silicon package
    runs-on: macos-14
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
    - uses: actions/checkout@v7

    - name: Verify Apple Silicon runner
      run: |
        test "$(uname -s)" = "Darwin"
        test "$(uname -m)" = "arm64"

    - name: Install native build dependencies
      run: brew install capnp libpcap

    - name: Install stable Rust
      run: |
        rustup toolchain install stable --profile minimal
        rustup default stable

    - name: Setup Git credentials
      timeout-minutes: 1
      env:
        ZPR_CICD_RO_TOKEN: ${{ secrets.ZPR_CICD_RO_TOKEN }}
      run: |
        echo 'echo $ZPR_CICD_RO_TOKEN' > "$HOME/.git-askpass"
        chmod +x "$HOME/.git-askpass"
        echo "GIT_ASKPASS=$HOME/.git-askpass" >> "$GITHUB_ENV"

    - name: Test adapter packages
      run: cargo test --locked --package ph --package ph-cli

    - name: Build unsigned development package
      run: |
        version="0.0.${GITHUB_RUN_NUMBER}"
        sh packaging/macos/build-adapter-pkg.sh \
          "$version" dist/zpr-adapter-macos-arm64.pkg \
          --development-unsigned
        target/aarch64-apple-darwin/release/ph adapter --help
        target/aarch64-apple-darwin/release/ph-cli --help

    - uses: actions/upload-artifact@v8
      with:
        name: zpr-adapter-macos-arm64-development
        path: dist/zpr-adapter-macos-arm64.pkg
        if-no-files-found: error
        retention-days: 1

  ios-arm64-library-build:
    name: iOS arm64 Rust library build (not app)
    runs-on: macos-14
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v7

    - name: Install native build dependencies
      run: brew install capnp

    - name: Install stable Rust and iOS target
      run: |
        rustup toolchain install stable --profile minimal
        rustup default stable
        rustup target add aarch64-apple-ios

    - name: Setup Git credentials
      timeout-minutes: 1
      env:
        ZPR_CICD_RO_TOKEN: ${{ secrets.ZPR_CICD_RO_TOKEN }}
      run: |
        echo 'echo $ZPR_CICD_RO_TOKEN' > "$HOME/.git-askpass"
        chmod +x "$HOME/.git-askpass"
        echo "GIT_ASKPASS=$HOME/.git-askpass" >> "$GITHUB_ENV"

    - name: Build iOS Rust library only
      run: cargo build --locked --release --package ph --lib --target aarch64-apple-ios

  # Build and upload ph
  build-ph:
    name: PH
    uses: org-zpr/zpr-dev-tools/.github/workflows/rust-build-test.yml@v1.3
    with:
      name: 'ph'
      path: './adapter/ph'
      package: true
      package-path: './target/debug/ph'
      needs-capnp: true
    secrets: inherit

  # Build and upload ph-cli
  build-ph-cli:
    name: PH CLI
    uses: org-zpr/zpr-dev-tools/.github/workflows/rust-build-test.yml@v1.3
    with:
      name: 'ph-cli'
      path: './adapter/cli'
      package: true
      package-path: './target/debug/ph-cli'
      runs-on: "['ubuntu-latest']"
      needs-libpcap: true
      needs-capnp: true
    secrets: inherit

  # Test ph, check for warnings, and check formatting
  test-ph:
    name: PH
    needs: [build-ph]
    uses: org-zpr/zpr-dev-tools/.github/workflows/rust-test.yml@v1.3
    with:
      name: 'ph'
      path: './adapter/ph'
      needs-capnp: true
    secrets: inherit

  # Test ph-cli, check for warnings, and check formatting
  test-ph-cli:
    name: PH CLI
    needs: [build-ph-cli]
    uses: org-zpr/zpr-dev-tools/.github/workflows/rust-test.yml@v1.3
    with:
      name: 'ph-cli'
      path: './adapter/cli'
      runs-on: "['ubuntu-latest']"
      needs-libpcap: true
      needs-capnp: true
    secrets: inherit

  # Integration tests
  basic-integration-test:
    name: Run 1-Node Test (v6)
    needs: [build-ph, build-ph-cli]
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    # Necessary to run before rust-cache
    - run: rustup toolchain install stable --profile minimal
    - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
      with:
        workspaces: |
          adapter/ph
          adapter/cli
          zpr-ext
          cslab
          cbpf-rs

    # see <https://github.com/docker-library/golang/issues/452>
    - name: Set workspace as safe
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Setup Git credentials
      timeout-minutes: 1
      run: |
        echo 'echo $ZPR_CICD_RO_TOKEN' > "$HOME/.git-askpass"
        chmod +x "$HOME/.git-askpass"
        echo "GIT_ASKPASS=$HOME/.git-askpass" >> "$GITHUB_ENV"
        go env -w GOPRIVATE="github.com/org-zpr/*"

    - uses: actions/download-artifact@v8
      with:
        pattern: ph-*${{ matrix.os }}
        merge-multiple: true

    - name: Build
      timeout-minutes: 10
      env:
        ZPR_CICD_RO_TOKEN: ${{ secrets.ZPR_CICD_RO_TOKEN }}
      run: |
        tar -xvf ph.tar
        tar -xvf ph-cli.tar

    - name: Download Asset
      uses: robinraju/release-downloader@v1
      with:
        repository: 'org-zpr/zpr-visaservice'
        tag: ${{ env.VISA_SERVICE_RELEASE }}
        fileName: 'release-linux-x86_64.tar.gz'
        extract: true
        out-file-path: 'integration-test'
        token: ${{ secrets.ZPR_CICD_RO_TOKEN }}

    - name: Set env
      run: |
        echo "DEBUG_TARGETS=all=DEBUG" >> $GITHUB_ENV

    - name: Install valkey
      timeout-minutes: 5
      run: |
        sudo apt-get update
        sudo apt install -y valkey
        sudo systemctl stop valkey-server
        sudo systemctl disable valkey-server

    - name: One Node v6 Test
      timeout-minutes: 10
      run: |
        ZPR_TEST_VERBOSE=1 VALKEY_SERVER_BIN=/usr/bin/valkey-server integration-test/one-node-v6-test.sh

  capture-integration-test:
    name: Run Capture Test
    needs: [build-ph, build-ph-cli]
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    # Necessary to run before rust-cache
    - run: rustup toolchain install stable --profile minimal
    - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
      with:
        workspaces: |
          adapter/ph
          adapter/cli
          zpr-ext
          cslab
          cbpf-rs

    # see <https://github.com/docker-library/golang/issues/452>
    - name: Set workspace as safe
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Setup Git credentials
      timeout-minutes: 1
      run: |
        echo 'echo $ZPR_CICD_RO_TOKEN' > "$HOME/.git-askpass"
        chmod +x "$HOME/.git-askpass"
        echo "GIT_ASKPASS=$HOME/.git-askpass" >> "$GITHUB_ENV"
        go env -w GOPRIVATE="github.com/org-zpr/*"

    - uses: actions/download-artifact@v8
      with:
        pattern: ph-*${{ matrix.os }}
        merge-multiple: true

    - name: Build
      timeout-minutes: 10
      env:
        ZPR_CICD_RO_TOKEN: ${{ secrets.ZPR_CICD_RO_TOKEN }}
      run: |
        tar -xvf ph.tar
        tar -xvf ph-cli.tar  

    - name: Download Asset
      uses: robinraju/release-downloader@v1
      with:
        repository: 'org-zpr/zpr-visaservice'
        tag: ${{ env.VISA_SERVICE_RELEASE }}
        fileName: 'release-linux-x86_64.tar.gz'
        extract: true
        out-file-path: 'integration-test'
        token: ${{ secrets.ZPR_CICD_RO_TOKEN }}

    - name: Install valkey
      timeout-minutes: 5
      run: |
        sudo apt-get update
        sudo apt install -y valkey
        sudo systemctl stop valkey-server
        sudo systemctl disable valkey-server

    - name: Set env
      run: |
        echo "DEBUG_TARGETS=all=DEBUG" >> $GITHUB_ENV

    - name: Capture Test
      timeout-minutes: 10
      run: |
        ZPR_TEST_VERBOSE=1 VALKEY_SERVER_BIN=/usr/bin/valkey-server integration-test/capture-test.sh
